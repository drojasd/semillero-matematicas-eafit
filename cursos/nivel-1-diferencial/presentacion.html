<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nivel 1: las bases del cálculo · Semillero de Matemáticas</title>
<style>

  --bg:#07121f; --surface:#0d2033; --surface2:#102a40; --line:#29465d;

.top a{font-size:.75rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--muted)}
.top span{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
main{flex:1;width:min(1180px,calc(100% - 32px));margin:0 auto;padding:22px 0 110px}
.kicker{margin:0 0 6px;color:var(--puras);font-size:.72rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
h1{margin:0;font:500 clamp(2.4rem,6.5vw,5.2rem)/.95 Georgia,"Times New Roman",serif;letter-spacing:-.04em}
h1 em,h2 em{color:var(--puras);font-weight:400}
h2{margin:0 0 14px;font:500 clamp(1.6rem,3.4vw,2.5rem)/1.08 Georgia,serif;letter-spacing:-.02em}
p{margin:0 0 12px}
.lead{color:#bfd0db;font:1.08rem/1.6 Georgia,serif;max-width:62ch}
.muted{color:var(--muted)} .small{font-size:.86rem}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:26px;align-items:start}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.panel{border:1px solid var(--line);border-radius:16px;background:#091827dc;padding:16px;min-width:0}
canvas{display:block;width:100%;height:360px;border-radius:12px;background:#050d17;border:1px solid #ffffff12;touch-action:none;cursor:crosshair}
canvas.short{height:300px}
canvas:focus-visible{outline:2px solid var(--puras);outline-offset:2px}
.ctl{display:grid;grid-template-columns:auto 1fr 3.4em;gap:8px 10px;align-items:center;margin:10px 0}

.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

button.b:hover{color:var(--ink);border-color:var(--muted)}
button.b.on{background:var(--surface2);color:var(--ink);border-color:var(--puras)}

.box.v{border-color:var(--violet);background:#bda0ff12}
.ok{color:var(--good)} .no{color:var(--bad)}

.chk{list-style:none;padding:0;margin:8px 0}
.chk li{display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:4px;margin:6px 0}
.form{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.9rem;color:var(--muted);margin:8px 0}

svg [role=button]{cursor:pointer;outline:none}
svg [role=button]:focus-visible .nd{stroke:var(--puras);stroke-width:3.5}
.tabs{display:flex;flex-wrap:wrap;gap:14px;overflow-x:auto}
table.cay{border-collapse:collapse;font:600 .85rem ui-monospace,Consolas,monospace}
table.cay td,table.cay th{min-width:1.9em;height:1.8em;text-align:center;border:1px solid #ffffff14;padding:0 2px}
table.cay th{color:var(--muted);background:#ffffff08}
table.cay td.one{background:#f5c96f33;color:var(--puras)}
table.cay td.zero{background:#53d5cd22;color:var(--biomat)}
table.cay tr.badrow td{background:#ff81941c}
.cover{min-height:58vh;display:flex;flex-direction:column;justify-content:center}
.keys{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;color:var(--muted);font-size:.85rem}

.dock .in{width:min(1180px,calc(100% - 32px));margin:0 auto;display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 0}
.dock .lbl{grid-column:1/-1;font-size:.78rem;color:var(--muted);letter-spacing:.06em;margin-top:-4px}

  .dock .in{grid-template-columns:auto minmax(0,1fr) auto auto}
  canvas{height:280px} canvas.short{height:240px}
  main{padding-bottom:130px}
}

S.push({ id: "limite", title: "Límite entre espacios topológicos", html: `

      ["conm", "<b>Conmutatividad</b>: <i>a</i> + <i>b</i> = <i>b</i> + <i>a</i>, <i>a</i> · <i>b</i> = <i>b</i> · <i>a</i>."],
      ["id", "<b>Identidades</b>: 0<sub>A</sub> con <i>a</i> + 0<sub>A</sub> = <i>a</i>; 1<sub>A</sub> con <i>a</i> · 1<sub>A</sub> = <i>a</i>, y 1<sub>A</sub> ≠ 0<sub>A</sub>."],
      ["invs", "<b>Inverso aditivo</b>: para cada <i>a</i> hay −<i>a</i> con <i>a</i> + (−<i>a</i>) = 0<sub>A</sub>. La resta no es una operación: es sumar el inverso."],
      ["invp", "<b>Inverso multiplicativo</b>: para cada <i>a</i> ≠ 0<sub>A</sub> hay <i>a</i>⁻¹ con <i>a</i> · <i>a</i>⁻¹ = 1<sub>A</sub>."],
      ["dist", "<b>Distributividad</b>: <i>a</i> · (<i>b</i> + <i>c</i>) = <i>a</i> · <i>b</i> + <i>a</i> · <i>c</i>."],
    ];
    const R = {
      R: [{}, "<b>Sí</b>: (ℝ, +, ·) cumple todas las condiciones."],
      Q: [{}, "<b>Sí</b>: los racionales también son un campo."],
      C: [{}, "<b>Sí</b>: los complejos forman un campo con su suma y su multiplicación."],
      Z: [{ invp: false }, "<b>No</b>: en general no hay inversos multiplicativos. Por ejemplo, ningún entero <i>a</i> cumple 2 · <i>a</i> = 1."],
      N: [{ invs: false, invp: false, id: null }, "<b>No</b>: en general no hay inversos; por ejemplo, ningún natural cumple 1 + <i>a</i> = 0. Que exista el neutro de la suma depende de la construcción (si 0 ∈ ℕ o no)."],
    };
    choice(r, "#sets .b", (k) => {
      const [fail, t] = R[k];
      $("#ax", r).innerHTML = AX.map(([id, h]) => `<li>${mark(id in fail ? fail[id] : true)}<span>${h}</span></li>`).join("");
      $("#resp", r).innerHTML = `¿${$(`#sets [data-k=${k}]`, r).textContent} es un campo? ${t}`;
    });
    $("#sets .b", r).click();
  } });

S.push({ id: "campitos", title: "Campitos", html: `
<p class="kicker">3 · «Campitos» creados por los estudiantes</p>
<h2>¿Un campo con <em>finitos</em> elementos?</h2>
<div class="cols">
  <div>
    <p>Toma <span class="m">{0, 1, … , <i>n</i> − 1}</span> y opera «como un reloj»: suma o multiplica y quédate con el residuo de dividir por <i>n</i>. Revisemos las propiedades de campo una por una, por fuerza bruta.</p>
    <div class="ctl"><label for="n"><i>n</i></label><input id="n" type="range" min="2" max="10" step="1" value="4" data-d="0"><output for="n"></output></div>
    <ul class="chk" id="ax"></ul>
    <div class="box" id="verd"></div>
  </div>
  <div class="panel"><div class="tabs" id="tabs"></div>
    <p class="small muted" style="margin:10px 0 0">En la tabla de ·, los 1 marcan inversos multiplicativos; una fila sin 1 (en rojo) es un elemento sin inverso.</p></div>
</div>`,
  mount(r) {
    slider(r, "n", (n) => {
      const E = [...Array(n).keys()], ad = (a, b) => (a + b) % n, mu = (a, b) => (a * b) % n;
      const all3 = (p) => E.every((a) => E.every((b) => E.every((c) => p(a, b, c))));
      const asoc = all3((a, b, c) => ad(ad(a, b), c) === ad(a, ad(b, c)) && mu(mu(a, b), c) === mu(a, mu(b, c)));
      const conm = all3((a, b) => ad(a, b) === ad(b, a) && mu(a, b) === mu(b, a));
      const dist = all3((a, b, c) => mu(a, ad(b, c)) === ad(mu(a, b), mu(a, c)));
      const invs = E.every((a) => E.some((b) => ad(a, b) === 0));
      const sinInv = E.filter((a) => a && !E.some((b) => mu(a, b) === 1));
      const tab = (op, sym, cls) => `<table class="cay" aria-label="Tabla de ${sym} módulo ${n}"><tr><th>${sym}</th>${E.map((b) => `<th>${b}</th>`).join("")}</tr>${E.map((a) => `<tr class="${sym === "·" && sinInv.includes(a) ? "badrow" : ""}"><th>${a}</th>${E.map((b) => { const c = op(a, b); return `<td class="${cls(c)}">${c}</td>`; }).join("")}</tr>`).join("")}</table>`;
      $("#tabs", r).innerHTML = tab(ad, "+", (c) => (c === 0 ? "zero" : "")) + tab(mu, "·", (c) => (c === 1 ? "one" : ""));
      $("#ax", r).innerHTML = [[true, "Cerradura: todo resultado es un residuo, está en el conjunto"], [asoc, "Asociatividad de + y ·"], [conm, "Conmutatividad de + y ·"], [true, "Identidades: 0 y 1, con 1 ≠ 0"], [invs, "Inverso aditivo: cada fila de + tiene un 0"],
        [!sinInv.length, `Inverso multiplicativo${sinInv.length ? `: no ${sinInv.length > 1 ? "lo tienen" : "lo tiene"} ${sinInv.join(", ")}` : ": cada fila de · (salvo la del 0) tiene un 1"}`], [dist, "Distributividad"]].map(([ok, t]) => `<li>${mark(ok)}<span>${t}</span></li>`).join("");
      const campo = asoc && conm && dist && invs && !sinInv.length;
      $("#verd", r).innerHTML = campo ? `<b class="ok">Con n = ${n} es un campo</b>: un campito de ${n} elementos.` : `<b class="no">Con n = ${n} no es un campo.</b> Por ejemplo, ${sinInv[0]} · <i>b</i> nunca da 1. ¿Para qué valores de <i>n</i> sí funciona?`;
    });
  } });

S.push({ id: "espacios", title: "Espacios vectoriales", html: `
<p class="kicker">4 · Espacios vectoriales</p>
<h2>Vectores: se <em>suman</em> y se <em>escalan</em></h2>
<div class="cols">
  <div>
    <p>Un espacio vectorial sobre un campo 𝕂 es <span class="m">(<i>V</i>, +<sub><i>V</i></sub>, ·<sub><i>V</i></sub>)</span>: una suma <span class="m">+<sub><i>V</i></sub> : <i>V</i> × <i>V</i> → <i>V</i></span> y un producto que toma un escalar <span class="m"><i>α</i> ∈ 𝕂</span> y un vector y devuelve otro vector de <i>V</i>.</p>
    <p class="small muted">Nueve propiedades: cerradura, asociatividad y conmutatividad de la suma, neutro e inverso aditivo, cerradura del producto por escalares, dos distributividades y <span class="m">1 · <i>v</i> = <i>v</i></span>. Mira algunas en ℝ², donde todo se hace componente a componente:</p>
    <div class="btns" id="ax" role="group" aria-label="Propiedad"><button class="b" data-k="suma">u + v y αu</button><button class="b" data-k="conm">u + v = v + u</button><button class="b" data-k="dist">α(u + v) = αu + αv</button><button class="b" data-k="inv">u + (−u) = 0</button></div>
    <div class="ctl"><label for="al"><i>α</i></label><input id="al" type="range" min="-2" max="2" step="0.05" value="1.5"><output for="al"></output></div>
    <div class="box t" id="txt"></div>
    <div class="box v small">Preguntas para el lector: ¿ℝ es un espacio vectorial? ¿ℝ² es un espacio vectorial?</div>
  </div>
  <div class="panel"><canvas id="cv" aria-label="Vectores u y v en el plano"></canvas>
    <p class="small muted" style="margin:8px 0 0">Arrastra las puntas de <i>u</i> y <i>v</i>. Con teclado: enfoca el lienzo, <kbd>Enter</kbd> cambia de vector y las flechas lo mueven.</p></div>
</div>`,
  mount(r) {
    let u = [2, .5], v = [.5, 1.5], al = 1.5, mode = "suma", V0 = null, dg = null;
    const add = (p, q) => [p[0] + q[0], p[1] + q[1]], sc = (a, p) => [a * p[0], a * p[1]], O = [0, 0];
    const cvs = Canvas($("#cv", r), (ctx, w, h) => {
      const vw = eqView(w, h, [-4, 4], [-3.5, 3.5]); V0 = vw; axes(ctx, vw, ["x₁", "x₂"]);
      const s = add(u, v);
      if (mode === "suma") { vec(ctx, vw, O, sc(al, u), "#ff8194", 2.5, "αu"); vec(ctx, vw, u, s, "#bda0ff88", 1.5, "", [5, 4]); vec(ctx, vw, O, s, C.gold, 3, "u + v"); }
      if (mode === "conm") { vec(ctx, vw, u, s, C.violet, 2, "", [6, 4]); vec(ctx, vw, v, s, C.teal, 2, "", [6, 4]); vec(ctx, vw, O, s, C.gold, 3, "u + v = v + u"); }
      if (mode === "dist") { const au = sc(al, u), av = sc(al, v), t = sc(al, s);
        vec(ctx, vw, O, s, "#f5c96f66", 2, "u + v"); vec(ctx, vw, O, au, "#53d5cd99", 2, "αu"); vec(ctx, vw, au, t, "#bda0ff", 2, "", [6, 4]); vec(ctx, vw, O, t, C.gold, 3, "α(u + v)"); }
      if (mode === "inv") { vec(ctx, vw, O, sc(-1, u), C.bad, 2.5, "−u"); vec(ctx, vw, u, O, "#ff819488", 1.5, "", [5, 4]); dot(ctx, vw, 0, 0, C.gold, 6); }
      vec(ctx, vw, O, u, C.teal, 3, "u"); vec(ctx, vw, O, v, C.violet, 3, "v");
      [u, v].forEach((p, i) => { if (dg && dg.sel === i) ring(ctx, vw, p[0], p[1], C.gold, 11); });
    });
    const say = () => { const s = add(u, v), au = sc(al, u), av = sc(al, v);
      $("#txt", r).innerHTML = {
        suma: `<span class="m"><i>u</i> + <i>v</i> = ${fv(u)} + ${fv(v)} = ${fv(s)}</span><br><span class="m"><i>α</i><i>u</i> = ${fmt(al)} · ${fv(u)} = ${fv(au)}</span>. Ambos resultados siguen en ℝ²: cerradura.`,
        conm: `Ir por <i>u</i> y luego por <i>v</i>, o por <i>v</i> y luego por <i>u</i>, termina en el mismo punto <span class="m">${fv(s)}</span>: el paralelogramo.`,
        dist: `<span class="m"><i>α</i>(<i>u</i> + <i>v</i>) = ${fmt(al)} · ${fv(s)} = ${fv(sc(al, s))}</span><br><span class="m"><i>α</i><i>u</i> + <i>α</i><i>v</i> = ${fv(au)} + ${fv(av)} = ${fv(add(au, av))}</span>. Escalar la suma o sumar lo escalado da lo mismo.`,
        inv: `<span class="m"><i>u</i> + (−<i>u</i>) = ${fv(u)} + ${fv(sc(-1, u))} = (0, 0)</span>, el neutro aditivo.`,
      }[mode]; };
    const upd = () => { cvs.draw(); say(); };
    const lim = (p) => [clamp(p[0], -4, 4), clamp(p[1], -3.5, 3.5)];
    dg = Drag($("#cv", r), () => V0, [{ get: () => u, set: (x, y) => { u = lim([x, y]); } }, { get: () => v, set: (x, y) => { v = lim([x, y]); } }], upd);
    slider(r, "al", (x) => { al = x; upd(); });
    choice(r, "#ax .b", (k) => { mode = k; upd(); }); $("#ax .b", r).click();
    return () => cvs.dispose();
  } });

S.push({ id: "polinomios", title: "Polinomios como vectores", html: `
<p class="kicker">4 · Ejemplos de espacios vectoriales</p>
<h2>Un polinomio también es un <em>vector</em></h2>
<div class="cols">
  <div>
    <p><span class="m"><i>P</i><sub>2</sub>(ℝ)</span>: polinomios de grado menor o igual a 2 con coeficientes reales. Se suman y se escalan coeficiente a coeficiente, igual que en <span class="m">ℝ³</span>. El ejemplo de las notas es <span class="m"><i>p</i>(<i>x</i>) = 3<i>x</i>² − <i>x</i> + 4</span>.</p>
    <div class="ctl"><label for="q2"><i>q</i>: <i>x</i>²</label><input id="q2" type="range" min="-3" max="3" step="0.1" value="-1"><output for="q2"></output></div>
    <div class="ctl"><label for="q1"><i>q</i>: <i>x</i></label><input id="q1" type="range" min="-3" max="3" step="0.1" value="2"><output for="q1"></output></div>
    <div class="ctl"><label for="q0"><i>q</i>: 1</label><input id="q0" type="range" min="-3" max="3" step="0.1" value="1"><output for="q0"></output></div>
    <div class="ctl"><label for="al"><i>α</i></label><input id="al" type="range" min="-2" max="2" step="0.05" value="0.5"><output for="al"></output></div>
    <div class="box t" id="txt"></div>
  </div>
  <div class="panel"><canvas id="cv" aria-label="Gráficas de p, q y αp + q"></canvas>
    <p class="small" style="margin:10px 0 0"><span style="color:var(--biomat)">━ <i>p</i></span> &nbsp; <span style="color:var(--violet)">━ <i>q</i></span> &nbsp; <span style="color:var(--puras)">━ <i>α</i><i>p</i> + <i>q</i></span></p></div>
</div>`,
  mount(r) {
    const p = [3, -1, 4], q = [-1, 2, 1]; let al = .5;
    const ev = (c) => (x) => c[0] * x * x + c[1] * x + c[2];
    const comb = () => p.map((c, i) => al * c + q[i]);
    const poly = (c) => { const t = [[c[0], "<i>x</i>²"], [c[1], "<i>x</i>"], [c[2], ""]].filter(([a]) => Math.abs(a) > 1e-9);
      return t.length ? t.map(([a, s], i) => `${a < 0 ? (i ? " − " : "−") : i ? " + " : ""}${Math.abs(a) === 1 && s ? "" : fmt(Math.abs(a), Number.isInteger(+Math.abs(a).toFixed(2)) ? 0 : 2)}${s}`).join("") : "0"; };
    const cvs = Canvas($("#cv", r), (ctx, w, h) => { const v = view(w, h, [-3, 3], [-10, 22]); axes(ctx, v);
      plotFn(ctx, v, ev(p), C.teal, 2.5); plotFn(ctx, v, ev(q), C.violet, 2.5); plotFn(ctx, v, ev(comb()), C.gold, 3); });
    const upd = () => { cvs.draw(); const c = comb();
      $("#txt", r).innerHTML = `<span class="m"><i>p</i> = ${poly(p)} ↔ (3, −1, 4)</span><br><span class="m"><i>q</i> = ${poly(q)} ↔ (${q.map((x) => fmt(x, 1)).join(", ")})</span><br><span class="m"><i>α</i><i>p</i> + <i>q</i> = ${poly(c)} ↔ (${c.map((x) => fmt(x)).join(", ")})</span>`; };
    ["q2", "q1", "q0"].forEach((id, i) => slider(r, id, (x) => { q[i] = x; upd(); }));
    slider(r, "al", (x) => { al = x; upd(); });
    return () => cvs.dispose();
  } });

S.push({ id: "base", title: "Base de un espacio vectorial", html: `
<p class="kicker">4.1 · Base para un espacio vectorial</p>
<h2>Cada vector, de <em>una sola</em> manera</h2>
<div class="cols">
  <div>
    <p><span class="m"><i>B<sub>V</sub></i> = {<i>e</i><sub>1</sub>, … , <i>e<sub>n</sub></i>}</span> es una base de <i>V</i> si cumple:</p>
    <ul class="chk" id="chk"></ul>
    <p class="small muted">Así cualquier vector se representa de manera única como combinación lineal: sus coordenadas son los <i>α</i>.</p>
    <div class="btns" id="pre" role="group" aria-label="Bases de ejemplo"><button class="b" data-k="can">Canónica</button><button class="b" data-k="obl">Oblicua</button><button class="b" data-k="dep">Dependientes</button></div>
    <div class="box t" id="txt"></div>
  </div>
  <div class="panel"><canvas id="cv" aria-label="Base e1, e2 y un vector v"></canvas>
    <p class="small muted" style="margin:8px 0 0">Arrastra <i>e</i><sub>1</sub>, <i>e</i><sub>2</sub> y <i>v</i>. La cuadrícula son las combinaciones con coeficientes enteros. Teclado: <kbd>Enter</kbd> cambia de punto, flechas lo mueven.</p></div>
</div>`,
  mount(r) {
    let e1 = [1, 0], e2 = [0, 1], v = [2.2, 1.4], V0 = null, dg = null;
    const P = { can: [[1, 0], [0, 1]], obl: [[1, .5], [-.5, 1]], dep: [[1, .5], [2, 1]] };
    const det = () => e1[0] * e2[1] - e2[0] * e1[1];
    const coords = () => { const d = det(); return [(v[0] * e2[1] - e2[0] * v[1]) / d, (e1[0] * v[1] - v[0] * e1[1]) / d]; };
    const cvs = Canvas($("#cv", r), (ctx, w, h) => {
      const vw = eqView(w, h, [-4, 4], [-3.5, 3.5]); V0 = vw; axes(ctx, vw, ["x₁", "x₂"]);
      const ind = Math.abs(det()) > 1e-6;
      if (ind) for (let k = -12; k <= 12; k++) {
        polyline(ctx, vw, [[k * e1[0] - 30 * e2[0], k * e1[1] - 30 * e2[1]], [k * e1[0] + 30 * e2[0], k * e1[1] + 30 * e2[1]]], "#53d5cd22", 1);
        polyline(ctx, vw, [[k * e2[0] - 30 * e1[0], k * e2[1] - 30 * e1[1]], [k * e2[0] + 30 * e1[0], k * e2[1] + 30 * e1[1]]], "#bda0ff22", 1);
      } else { const d = Math.hypot(...e1) > 1e-9 ? e1 : e2; if (Math.hypot(...d) > 1e-9) polyline(ctx, vw, [[-30 * d[0], -30 * d[1]], [30 * d[0], 30 * d[1]]], "#ff819466", 3); }
      if (ind) { const [a1, a2] = coords(), p = [a1 * e1[0], a1 * e1[1]];
        vec(ctx, vw, [0, 0], p, "#53d5cdaa", 2, "", [6, 4]); vec(ctx, vw, p, v, "#bda0ffaa", 2, "", [6, 4]); }
      vec(ctx, vw, [0, 0], v, C.gold, 3, "v"); vec(ctx, vw, [0, 0], e1, C.teal, 3, "e₁"); vec(ctx, vw, [0, 0], e2, C.violet, 3, "e₂");
      [e1, e2, v].forEach((p, i) => { if (dg && dg.sel === i) ring(ctx, vw, p[0], p[1], C.gold, 11); });
    });
    const upd = () => { cvs.draw(); const ind = Math.abs(det()) > 1e-6;
      let dep = ""; if (!ind) { if (Math.hypot(...e1) < 1e-9) dep = "1 · <i>e</i>₁ + 0 · <i>e</i>₂ = 0"; else { const l = Math.abs(e1[0]) > 1e-9 ? e2[0] / e1[0] : e2[1] / e1[1]; dep = `${fmt(l)} · <i>e</i>₁ − 1 · <i>e</i>₂ = 0`; } }
      $("#chk", r).innerHTML = `<li>${mark(ind)}<span><b>Generación</b>: todo <span class="m"><i>v</i> = <i>α</i><sub>1</sub><i>e</i><sub>1</sub> + <i>α</i><sub>2</sub><i>e</i><sub>2</sub></span> con <span class="m"><i>α<sub>i</sub></i> ∈ 𝕂</span>${ind ? "" : `: <span class="no">solo se alcanza una recta</span>`}.</span></li>
        <li>${mark(ind)}<span><b>Independencia lineal</b>: si <span class="m"><i>α</i><sub>1</sub><i>e</i><sub>1</sub> + <i>α</i><sub>2</sub><i>e</i><sub>2</sub> = 0<sub><i>V</i></sub></span>, entonces <span class="m"><i>α</i><sub>1</sub> = <i>α</i><sub>2</sub> = 0</span>${ind ? "" : `: <span class="no">falla, <span class="m">${dep}</span></span>`}.</span></li>`;
      if (ind) { const [a1, a2] = coords(); $("#txt", r).innerHTML = `<span class="m"><i>v</i> = ${fv(v)} = <span style="color:var(--biomat)">${fmt(a1)}</span> <i>e</i><sub>1</sub> + <span style="color:var(--violet)">${fmt(a2)}</span> <i>e</i><sub>2</sub></span>. Las coordenadas de <i>v</i> en esta base son <span class="m">(${fmt(a1)}, ${fmt(a2)})</span>; en otra base son otras, pero el vector es el mismo.`; }
      else $("#txt", r).innerHTML = `<b class="no">No es base.</b> <i>e</i><sub>1</sub> y <i>e</i><sub>2</sub> están sobre la misma recta: los vectores fuera de ella no se pueden escribir, y los de la recta se escriben de infinitas maneras.`;
    };
    const lim = (x, y) => [clamp(x, -4, 4), clamp(y, -3.5, 3.5)];
    dg = Drag($("#cv", r), () => V0, [{ get: () => e1, set: (x, y) => { e1 = lim(x, y); } }, { get: () => e2, set: (x, y) => { e2 = lim(x, y); } }, { get: () => v, set: (x, y) => { v = lim(x, y); } }], upd, { snap: .25 });
    choice(r, "#pre .b", (k) => { [e1, e2] = P[k].map((p) => [...p]); upd(); }); $("#pre .b", r).click();
    return () => cvs.dispose();
  } });

S.push({ id: "lineales", title: "Funciones lineales", html: `
<p class="kicker">5 · Funciones lineales</p>
<h2>Una función lineal queda fija por lo que hace con la <em>base</em></h2>
<p><span class="m"><i>f</i> : (<i>V</i>, +<sub><i>V</i></sub>, ·<sub><i>V</i></sub>) → (<i>U</i>, +<sub><i>U</i></sub>, ·<sub><i>U</i></sub>)</span> es lineal si <span class="m"><i>f</i>(<i>α</i><i>v</i><sub>1</sub> + <i>β</i><i>v</i><sub>2</sub>) = <i>α</i><i>f</i>(<i>v</i><sub>1</sub>) + <i>β</i><i>f</i>(<i>v</i><sub>2</sub>)</span>: preserva la suma (aditividad) y el producto por escalares (homogeneidad).</p>
<div class="btns" id="modo" role="group" aria-label="Función"><button class="b" data-k="lin">lineal: arrastra f(e₁), f(e₂)</button><button class="b" data-k="tras"><span class="m"><i>f</i>(<i>x</i>, <i>y</i>) = (<i>x</i> + 1, <i>y</i>)</span></button><button class="b" data-k="cuad"><span class="m"><i>f</i>(<i>x</i>, <i>y</i>) = (<i>x</i> + <i>y</i>²/4, <i>y</i>)</span></button></div>
<div class="cols even">

    const lim = (x, y, m) => [clamp(x, -m, m), clamp(y, -m, m)];
    dgD = Drag($("#dom", r), () => VD, [{ get: () => v1, set: (x, y) => { v1 = lim(x, y, 3); } }], upd, { free: 0 });
    dgC = Drag($("#cod", r), () => VC, [{ get: () => f1, set: (x, y) => { if (mode === "lin") f1 = lim(x, y, 4); } }, { get: () => f2, set: (x, y) => { if (mode === "lin") f2 = lim(x, y, 4); } }], upd);

S.push({ id: "dual", title: "Espacio dual", html: `

S.push({ id: "diferenciable", title: "Diferenciabilidad en ℝ", html: `
<p class="kicker">7 · Diferenciabilidad en ℝ</p>
<h2>La diferencial: la mejor aproximación <em>lineal</em></h2>
<div class="cols">
  <div>
    <p><span class="m"><i>f</i> : ℝ ⊇ <i>U</i> → ℝ</span>, con <i>U</i> abierto y <span class="m"><i>x</i> ∈ <i>U</i></span>, es <b>diferenciable en <i>x</i></b> si existe una función lineal en <i>h</i>, <span class="m"><i>A</i>(<i>x</i>, <i>h</i>)</span>, tal que</p>
    <div class="eq"><i>f</i>(<i>x</i> + <i>h</i>) − <i>f</i>(<i>x</i>) = <i>A</i>(<i>x</i>, <i>h</i>) + <i>o</i>(<i>h</i>), &nbsp; lím<sub><i>h</i>→0</sub> <i>o</i>(<i>h</i>)/<i>h</i> = 0.</div>
    <p class="small">Una función lineal de ℝ en ℝ es <span class="m"><i>h</i> ↦ <i>m</i> · <i>h</i></span>. Escoge <i>m</i> y mira si el resto <i>o</i>(<i>h</i>) es infinitesimal.</p>
    <div class="btns" id="fn" role="group" aria-label="Función"><button class="b" data-k="x2"><span class="m"><i>x</i>²</span></button><button class="b" data-k="sin"><span class="m">sin <i>x</i></span></button><button class="b" data-k="exp"><span class="m"><i>e</i><sup><i>x</i></sup></span></button><button class="b" data-k="x3"><span class="m"><i>x</i>³</span></button><button class="b" data-k="abs"><span class="m">|<i>x</i>|</span></button></div>
    <div class="ctl"><label for="x"><i>x</i></label><input id="x" type="range" min="-1.5" max="1.5" step="0.05" value="1"><output for="x"></output></div>
    <div class="ctl"><label for="h"><i>h</i></label><input id="h" type="range" min="-1" max="1" step="0.01" value="0.6"><output for="h"></output></div>
    <div class="ctl"><label for="m"><i>m</i></label><input id="m" type="range" min="-4" max="4" step="0.01" value="1"><output for="m"></output></div>
    <div class="btns"><button class="b" id="best">Mejor m</button><button class="b" id="shrink">▶ h → 0</button></div>
  </div>
  <div>
    <div class="panel"><canvas id="cv" class="short" aria-label="Gráfica de f con la aproximación lineal"></canvas>
      <p class="small" style="margin:8px 0 0"><span style="color:var(--puras)">━ <i>A</i>(<i>x</i>, <i>h</i>) = <i>m</i><i>h</i></span> &nbsp; <span style="color:var(--bad)">━ <i>o</i>(<i>h</i>)</span> &nbsp; <span style="color:var(--muted)">━ <i>f</i></span></p></div>
    <div class="panel" style="margin-top:12px"><canvas id="cv2" class="short" aria-label="El cociente o(h)/h como función de h"></canvas>
      <div class="box" id="txt"></div></div>
  </div>
</div>`,
  mount(r) {
    const FN = { x2: { f: (x) => x * x, yr: [-1, 4] }, sin: { f: Math.sin, yr: [-2, 2] }, exp: { f: Math.exp, yr: [-.5, 6] }, x3: { f: (x) => x ** 3, yr: [-4, 4] }, abs: { f: Math.abs, yr: [-.8, 2.8] } };
    let k = "x2", x = 1, h = .6, m = 1;
    const der = () => { const f = FN[k].f, e = 1e-6, L = (f(x) - f(x - e)) / e, R = (f(x + e) - f(x)) / e; return [Math.abs(L - R) < 1e-3 ? (L + R) / 2 : null, L, R]; };

      ctx.lineWidth = 4; ctx.strokeStyle = C.gold; ctx.beginPath(); ctx.moveTo(v.X(x + h), v.Y(y0)); ctx.lineTo(v.X(x + h), v.Y(ya)); ctx.stroke();
      ctx.strokeStyle = C.bad; ctx.beginPath(); ctx.moveTo(v.X(x + h) + 5, v.Y(ya)); ctx.lineTo(v.X(x + h) + 5, v.Y(y1)); ctx.stroke(); ctx.restore();
      dot(ctx, v, x, y0, C.ink, 5); dot(ctx, v, x + h, y1, C.bad, 5);
      ctx.fillStyle = C.muted; ctx.font = "italic 13px Georgia,serif"; ctx.textAlign = "center"; ctx.fillText("h", v.X(x + h / 2), v.Y(y0) + (y1 >= y0 ? 16 : -8));
    });
    const c2 = Canvas($("#cv2", r), (ctx, w, hh) => {

      const [, L, R] = der(); ring(ctx, v, 0, 0, C.gold, 7, 2);

      else t += `<b class="no">o(h)/h → ${fmt(d - m)} ≠ 0.</b> Con esta <i>m</i> el resto no es infinitesimal: acerca la recta dorada hasta que el círculo dorado y los del cociente coincidan.`;
      $("#txt", r).innerHTML = t; $("#best", r).disabled = d === null; };
    const upd = () => { c1.draw(); c2.draw(); say(); };
    const sx = slider(r, "x", (z) => { x = Math.round(z * 100) / 100; upd(); }), sh = slider(r, "h", (z) => { h = z; upd(); }), sm = slider(r, "m", (z) => { m = z; upd(); });

      if (Math.abs(h) <= .011) setR(sh, h < 0 ? -.8 : .8);

S.push({ id: "diferencial-general", title: "Diferenciabilidad general", html: `

    <p><span class="m"><i>f</i> : (𝕂, +, ·) → (𝕂, +, ·)</span> es diferenciable en <span class="m"><i>x</i> ∈ <i>U</i> ⊂ 𝕂</span> si <span class="m"><i>f</i>(<i>x</i> + <i>h</i>) − <i>f</i>(<i>x</i>) = <i>A</i>(<i>x</i>, <i>h</i>) + <i>o</i>(<i>h</i>)</span>, con <i>A</i> lineal en <i>h</i> y <i>o</i>(<i>h</i>) infinitesimal. Lo que cambia es qué significa «lineal»: lineal <b>sobre 𝕂</b>.</p>
    <p class="small">Ejemplo con <span class="m">𝕂 = ℂ</span>: una función lineal de ℂ en ℂ es <span class="m"><i>h</i> ↦ <i>c</i> · <i>h</i></span>, y multiplicar por un complejo <i>c</i> <b>rota y escala</b>. Miramos un círculo pequeño de radio <i>r</i> alrededor de <i>z</i><sub>0</sub> y su imagen, ampliados por 1/<i>r</i>.</p>
    <div class="btns" id="fn" role="group" aria-label="Función"><button class="b" data-k="z2"><span class="m"><i>z</i>²</span></button><button class="b" data-k="z3"><span class="m"><i>z</i>³</span></button><button class="b" data-k="exp"><span class="m"><i>e</i><sup><i>z</i></sup></span></button><button class="b" data-k="conj"><span class="m"><math class="acc"><mover accent="true"><mi>z</mi><mo>¯</mo></mover></math> (conjugado)</span></button></div>
    <div class="ctl"><label for="re">Re <i>z</i><sub>0</sub></label><input id="re" type="range" min="-1.5" max="1.5" step="0.05" value="0.6"><output for="re"></output></div>
    <div class="ctl"><label for="im">Im <i>z</i><sub>0</sub></label><input id="im" type="range" min="-1.5" max="1.5" step="0.05" value="0.4"><output for="im"></output></div>
    <div class="ctl"><label for="s"><i>r</i></label><input id="s" type="range" min="-2" max="0.2" step="0.02" value="0" data-fmt="pow10"><output for="s"></output></div>
    <div class="btns"><button class="b" id="shrink">▶ r → 0</button></div>
  </div>
  <div class="panel"><canvas id="cv" aria-label="Imagen ampliada de un círculo pequeño alrededor de z0"></canvas>
    <p class="small" style="margin:8px 0 0"><span style="color:var(--muted)">┈ <i>h</i>/<i>r</i></span> &nbsp; <span style="color:var(--biomat)">━ (<i>f</i>(<i>z</i><sub>0</sub> + <i>h</i>) − <i>f</i>(<i>z</i><sub>0</sub>))/<i>r</i></span> &nbsp; <span style="color:var(--puras)">┅ <i>c</i> · <i>h</i>/<i>r</i></span> &nbsp; ● <i>h</i> = <i>r</i> &nbsp; <span style="color:var(--violet)">●</span> <i>h</i> = <i>ir</i></p>
    <div class="box" id="txt"></div></div>
</div>`,
  mount(r) {
    const cm = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]], ce = (z) => [Math.exp(z[0]) * Math.cos(z[1]), Math.exp(z[0]) * Math.sin(z[1])];
    const FZ = { z2: [(z) => cm(z, z), (z) => [2 * z[0], 2 * z[1]]], z3: [(z) => cm(z, cm(z, z)), (z) => { const q = cm(z, z); return [3 * q[0], 3 * q[1]]; }], exp: [ce, ce], conj: [(z) => [z[0], -z[1]], null] };
    let k = "z2", z0 = [.6, .4], s = 0;
    const Q = (t) => { const rr = 10 ** s, f = FZ[k][0], a = f([z0[0] + rr * Math.cos(t), z0[1] + rr * Math.sin(t)]), b = f(z0); return [(a[0] - b[0]) / rr, (a[1] - b[1]) / rr]; };
    const cOf = () => (FZ[k][1] ? FZ[k][1](z0) : null);
    const cvs = Canvas($("#cv", r), (ctx, w, h) => {
      const c = cOf(), N = 180, pts = [], cps = []; let R = 1.6;
      for (let i = 0; i <= N; i++) { const t = 2 * Math.PI * i / N, p = Q(t); pts.push(p); R = Math.max(R, Math.hypot(...p) * 1.15); if (c) cps.push(cm(c, [Math.cos(t), Math.sin(t)])); }
      R = Math.min(R, 14); const v = eqView(w, h, [-R, R], [-R, R]); axes(ctx, v, ["Re", "Im"]);
      polyline(ctx, v, Array.from({ length: N + 1 }, (_, i) => [Math.cos(2 * Math.PI * i / N), Math.sin(2 * Math.PI * i / N)]), "#a6bdcb88", 1.5, [3, 4]);
      if (c) polyline(ctx, v, cps, C.gold, 2, [7, 5]);
      polyline(ctx, v, pts, C.teal, 2.5);
      const tip = (p, q, col) => arrowPx(ctx, v.X(p[0]), v.Y(p[1]), v.X(q[0]), v.Y(q[1]), col, 2.5);
      tip(pts[20], pts[24], C.teal); tip([Math.cos(.7), Math.sin(.7)], [Math.cos(.84), Math.sin(.84)], "#a6bdcb");
      dot(ctx, v, 1, 0, C.ink, 4); dot(ctx, v, 0, 1, C.violet, 4);
      if (c) { const ci = cm(c, [0, 1]); ring(ctx, v, c[0], c[1], C.gold, 8); ring(ctx, v, ci[0], ci[1], C.gold, 8); }
      dot(ctx, v, pts[0][0], pts[0][1], C.ink, 6); dot(ctx, v, pts[N / 4][0], pts[N / 4][1], C.violet, 6);
    });
    const say = () => { const c = cOf(), rr = 10 ** s;
      if (c) { let e = 0; for (let i = 0; i < 360; i++) { const t = 2 * Math.PI * i / 360, p = Q(t), q = cm(c, [Math.cos(t), Math.sin(t)]); e = Math.max(e, Math.hypot(p[0] - q[0], p[1] - q[1])); }
        $("#txt", r).innerHTML = `Con <span class="m"><i>c</i> = ${fmt(c[0])} ${c[1] < 0 ? "−" : "+"} ${fmt(Math.abs(c[1]))}<i>i</i></span>: <span class="m">máx<sub>|<i>h</i>| = <i>r</i></sub> |<i>o</i>(<i>h</i>)/<i>h</i>| = ${fmt(e, 4)}</span> con <i>r</i> = ${fmt(rr, 3)}. Encoge <i>r</i>: el error tiende a 0 y la imagen se vuelve el círculo dorado, rotado y escalado. <b class="ok">Diferenciable sobre ℂ</b>, con <span class="m"><i>A</i>(<i>z</i><sub>0</sub>, <i>h</i>) = <i>c</i> · <i>h</i></span>.`; }
      else $("#txt", r).innerHTML = `La imagen recorre el círculo <b>al revés</b>: el punto violeta queda a −90° del blanco, y eso no cambia al encoger <i>r</i>. Multiplicar por cualquier <i>c</i> conserva el sentido de giro, así que ninguna <span class="m"><i>h</i> ↦ <i>c</i> · <i>h</i></span> sirve: aquí <span class="m"><i>o</i>(<i>h</i>)/<i>h</i> = <i>h̄</i>/<i>h</i> − <i>c</i></span> y su máximo sobre el círculo es <span class="m">1 + |<i>c</i>| ≥ 1</span> para todo <i>r</i>. <b class="no">No es diferenciable sobre ℂ</b> (sobre ℝ², <i>h</i> ↦ <i>h̄</i> sí es lineal: una reflexión).`;
    };
    const upd = () => { cvs.draw(); say(); };
    slider(r, "re", (x) => { z0[0] = x; upd(); }); slider(r, "im", (x) => { z0[1] = x; upd(); }); const ss = slider(r, "s", (x) => { s = x; upd(); });
    const loop = Loop((dt) => { setR(ss, Math.max(-2, s - dt * .9)); if (s <= -2) { $("#shrink", r).textContent = "▶ r → 0"; return false; } });
    $("#shrink", r).addEventListener("click", () => {
      if (loop.on) { loop.stop(); $("#shrink", r).textContent = "▶ r → 0"; return; }
      if (RM) { setR(ss, -2); return; }
      if (s <= -1.99) setR(ss, 0);
      loop.start(); $("#shrink", r).textContent = "❚❚ Pausa";
    });
    choice(r, "#fn .b", (key) => { k = key; upd(); }); $("#fn .b", r).click();
    return () => { loop.stop(); cvs.dispose(); };
  } });

S.push({ id: "sintesis", title: "Lo que te llevas", html: `
<p class="kicker">Síntesis</p>
<h2>Lo que te <em>llevas</em></h2>
<div class="cols even">
  <div class="panel"><ul class="clean">
    <li>Una <b>función</b> es un subconjunto de <i>A</i> × <i>B</i> con exactamente una pareja por cada elemento del dominio.</li>
    <li>Una <b>topología</b> dice qué conjuntos son abiertos; una función es <b>continua</b> si la preimagen de todo abierto es abierta, y un <b>homeomorfismo</b> es una biyección continua con inversa continua.</li>
    <li>El <b>límite</b> es el conjunto de los <i>b</i> tales que todo entorno de <i>b</i> contiene la imagen de algún entorno perforado de <i>a</i>.</li>
  </ul></div>
  <div class="panel"><ul class="clean">
    <li>Un <b>campo</b> es un conjunto con suma y producto que cumplen cerradura, asociatividad, conmutatividad, identidades, inversos y distributividad.</li>
    <li>En un <b>espacio vectorial</b> una <b>base</b> da coordenadas únicas, y una <b>función lineal</b> queda determinada por su acción sobre la base: un funcional del <b>dual</b> es un vector fila.</li>
    <li>Ser <b>diferenciable</b> es admitir una aproximación lineal <i>A</i>(<i>x</i>, <i>h</i>) con un resto <i>o</i>(<i>h</i>) infinitesimal; «lineal» depende del campo.</li>
  </ul></div>
</div>
<p class="muted small" style="margin-top:22px">Basado en las notas del Nivel 1 de Andrés Restrepo Botero y Felipe Arcila Palacio, Semilleros de matemáticas puras y de matemáticas, Universidad EAFIT.</p>` });

/* ===================== motor de escenas ===================== */
const stage = $("#stage"), prog = $("#prog"), lbl = $("#lbl");
prog.max = S.length - 1;
let cur = -1, dispose = null;
function go(i, push = true) {
  i = clamp(i | 0, 0, S.length - 1);
  if (i === cur) return;
  if (dispose) { try { dispose(); } catch (e) { console.error(e); } dispose = null; }
  cur = i; const sc = S[i];
  stage.innerHTML = sc.html;
  dispose = sc.mount ? sc.mount(stage) || null : null;
  prog.value = i; lbl.textContent = `${i + 1} / ${S.length} · ${sc.title}`;
  $("#prev").disabled = i === 0; $("#next").disabled = i === S.length - 1;
  document.title = i === 0 ? `${sc.title} · Semillero de Matemáticas` : `${sc.title} · Nivel 1`;
  if (push && location.hash.slice(1) !== sc.id) history.replaceState(null, "", "#" + sc.id);
  window.scrollTo(0, 0);
}
function fromHash() { const h = decodeURIComponent(location.hash.slice(1)); const n = S.findIndex((s) => s.id === h); return n >= 0 ? n : /^\d+$/.test(h) ? +h - 1 : 0; }
$("#prev").addEventListener("click", () => go(cur - 1));
$("#next").addEventListener("click", () => go(cur + 1));
prog.addEventListener("input", () => go(+prog.value));
$("#full").addEventListener("click", toggleFull);
function toggleFull() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); }
window.addEventListener("hashchange", () => go(fromHash(), false));
window.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (e.defaultPrevented || tag === "input" || tag === "textarea" || tag === "select" || e.altKey || e.ctrlKey || e.metaKey) return;
  if (["ArrowRight", "PageDown"].includes(e.key) || (e.key === " " && tag !== "button")) { e.preventDefault(); go(cur + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === "Home") { e.preventDefault(); go(0); }
  else if (e.key === "End") { e.preventDefault(); go(S.length - 1); }
  else if (e.key === "f" || e.key === "F") toggleFull();
});
go(fromHash());
</script>
